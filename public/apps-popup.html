<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Apps</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Figtree, Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #ffffff;
      color: #202124;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #ffffff;
    }

    body {
      border: 1px solid rgba(32, 33, 36, 0.12);
      border-radius: 12px;
    }

    #apps-popup {
      height: 100%;
      padding: 10px;
      overflow: auto;
    }

    .apps-plugin-entry + .apps-plugin-entry {
      margin-top: 4px;
    }

    .apps-plugin-header,
    .apps-renderer-item {
      width: 100%;
      min-height: 34px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: inherit;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px 10px;
      font: inherit;
      text-align: left;
      cursor: default;
    }

    .apps-plugin-header {
      font-weight: 700;
    }

    .apps-plugin-header:hover,
    .apps-plugin-header:focus-visible,
    .apps-renderer-item:hover,
    .apps-renderer-item:focus-visible {
      background: #f2f4f8;
      outline: none;
    }

    .chevron {
      width: 12px;
      font-size: 12px;
      line-height: 1;
      transform: rotate(0deg);
      transition: transform 120ms ease;
    }

    .apps-plugin-header.expanded .chevron {
      transform: rotate(90deg);
    }

    .apps-renderer-list {
      display: none;
      padding: 2px 0 4px 20px;
    }

    .apps-renderer-list.expanded {
      display: block;
    }

    .apps-renderer-item {
      color: #5f6368;
      font-weight: 500;
    }

    .apps-empty {
      padding: 18px 10px;
      color: #6b7280;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="apps-popup" role="menu" aria-label="Apps">
    <div class="apps-empty">Loading apps...</div>
  </div>
  <script src="./apps-popup.js"></script>
</body>
</html>
