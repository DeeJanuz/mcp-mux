<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light">
  <title>Apps</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Figtree, Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #ffffff;
      color: #202124;
      --popup-border: rgba(32, 33, 36, 0.12);
      --popup-hover: rgba(32, 33, 36, 0.06);
      --popup-text-primary: #202124;
      --popup-text-secondary: #5f6368;
      --popup-text-tertiary: #6b7280;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #ffffff;
    }

    body {
      border: 1px solid var(--popup-border);
      border-radius: 12px;
    }

    #apps-popup {
      height: 100%;
      padding: 8px 0;
      overflow: auto;
    }

    .apps-plugin-header,
    .apps-renderer-item {
      width: 100%;
      border: 0;
      border-radius: 0;
      background: transparent;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: inherit;
      font-size: 13px;
      line-height: 1.3;
      text-align: left;
      cursor: pointer;
      user-select: none;
    }

    .apps-plugin-header {
      min-height: 32px;
      padding: 8px 16px;
      color: var(--popup-text-primary);
      font-weight: 600;
    }

    .apps-plugin-header:hover,
    .apps-plugin-header:focus-visible,
    .apps-renderer-item:hover,
    .apps-renderer-item:focus-visible {
      background: var(--popup-hover);
      outline: none;
    }

    .chevron {
      flex: 0 0 auto;
      width: 10px;
      font-size: 10px;
      line-height: 1;
      transform: rotate(0deg);
      transition: transform 0.2s;
    }

    .apps-plugin-header.expanded .chevron {
      transform: rotate(90deg);
    }

    .apps-renderer-list {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.2s ease;
    }

    .apps-renderer-list.expanded {
      max-height: 360px;
      overflow-y: auto;
    }

    .apps-context-block {
      padding: 4px 0;
    }

    .apps-context-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px 4px 32px;
      color: var(--popup-text-tertiary);
      font-size: 11px;
      line-height: 1.3;
    }

    .apps-context-toggle {
      min-width: 0;
      flex: 1;
      display: flex;
      align-items: center;
      gap: 8px;
      border: none;
      background: transparent;
      color: inherit;
      cursor: pointer;
      font: inherit;
      line-height: inherit;
      padding: 0;
      text-align: left;
    }

    .apps-context-toggle:hover,
    .apps-context-toggle:focus-visible {
      color: var(--popup-text-secondary);
    }

    .apps-context-chevron {
      width: 10px;
      flex: 0 0 10px;
      font-size: 9px;
      line-height: 1;
      transition: transform 0.2s;
    }

    .apps-context-toggle.expanded .apps-context-chevron {
      transform: rotate(90deg);
    }

    .apps-context-label {
      min-width: 0;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .apps-context-status {
      font-size: 10px;
      color: var(--popup-text-tertiary);
    }

    .apps-context-default-button {
      width: 20px;
      height: 20px;
      border: none;
      background: transparent;
      color: var(--popup-text-tertiary);
      cursor: pointer;
      padding: 0;
      line-height: 20px;
    }

    .apps-context-collapsed .apps-context-items {
      display: none;
    }

    .apps-renderer-item {
      min-height: 30px;
      padding: 6px 16px 6px 32px;
      color: var(--popup-text-secondary);
      font-weight: 400;
    }

    .apps-context-block .apps-renderer-item {
      padding-left: 44px;
    }

    .apps-renderer-item:hover,
    .apps-renderer-item:focus-visible {
      color: var(--popup-text-primary);
    }

    .apps-empty {
      padding: 16px;
      color: var(--popup-text-tertiary);
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="apps-popup" role="menu" aria-label="Apps">
    <div class="apps-empty">Loading apps...</div>
  </div>
  <script src="./apps-menu-model.js"></script>
  <script src="./apps-popup.js"></script>
</body>
</html>
